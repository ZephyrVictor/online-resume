profile:
  show: true
  order: 7
  title: 个人陈述
  description: |
    本人是校 Lilac 战队成员，参与国内多场知名CTF赛事和护网测试行动。主要方向为二进制和取证分析, 主
    要编程语言为 Python & C++。擅长网络与计算机系统相关领域。自去年起为学校网络中心挖掘校内漏洞，并维护部分网站。能够熟练使用MYSQL等数据库和其他中间件，能够熟悉使用Git作为版本工具、团队代码开发合作。爱好广泛，学理论基础扎实，做事
    严谨认真，乐于学习新知，对知识和技术充满热情，富有团队合作精神与组织能力，目前正在探索人工智能，特别是LLM在安全领域的自动化分析相关研究。
  

project:
  show: true
  order: 4
  title: 项目经历

  items:

    - name: 评估 LLM 在网络安全攻防任务的 BenchMark
      tags: 科研项目
      date: 2023.11 - 2024.04
      role: 项目成员
      description: |
        收集国内外CTF题目作为数据集，并细化不同方向的题目考点（漏洞点）。  
        - **评估指标**：利用题目难度 / 解题分数评估 **Deepseek、ChatGPT** 等 LLM 在网络攻防中的表现。  
        - **Agent 设计**：采用 **提前预输入 Prompt** 及 **上下文压缩**，确保评估的公平性。  

    - name: 面向网络设备的漏洞挖掘与分析系统
      tags: 工程项目
      date: 2026.07 - 今
      role: 项目成员
      description: |
        实验室项目，基于可配置agent编排框架，面向自有/授权固件上完成多厂商实战漏洞挖掘和验证流程，
          - 鉴于SOTA LLM的自主能力，探索Agent在任务自主拆解上的可能性。
          - 探索长期记忆在漏洞审计中的应用，尝试将漏洞挖掘过程中的上下文信息进行提炼，并放入长期记忆存储，以便在后续审计中找到相同范式的漏洞。

    - name: LLM驱动的漏洞分析项目
      tags: 竞赛项目
      date: 2025.09 - 2025.12
      role: 项目负责人
      description: |
        竞赛驱动，面向强网杯AI智能分析子赛道，根据比赛要求，开发了一个以项目源码和CVE信息为输入、输出漏洞的变量传播污点路径和CodeQL查询规则的系统，获得线上初赛和线下决赛的冠军。后续计划以该项目作为基础投稿论文。

    - name: 多Agent协同的开源项目漏洞智能化辅助验证技术
      tags: 科研项目
      date: 2025.10 - 2026.09
      role: 项目负责人
      description: |
        研究基于多智能体框架的安全漏洞智能化辅助验证及规范化 POC 代码生成
          1. 基于 LLM（包括：开源 LLM 本地部署、公共 LLM API 接口）结合知识图谱 RAG 的开源项目
          安全漏洞分析与测试场景部署智能体
          2. 基于 LLM 结合多语言 POC 样本的漏洞规范化 POC 代码生成智能体
          3. 基于 LLM 的漏洞模板化 POC 验证测试智能体
          4. 基于 LLM 结合漏洞测试场景多轮交互的漏洞 POC 代码调试优化智能体
          项目选用常见的开源项目作为分析对象，如Log4j，Flask，Tomcat，libjepg等

    - name: 字节跳动
      tags: 抖音研发-攻防蓝军-实习
      date: 2026.04 - 今
      role: 实习
      description: |
        - 测评抖音业务线中涉及LLM的功能，评估安全水位。范畴为沙箱逃逸、提示词注入、数据泄漏等Agent安全问题和Jailbreak等内容安全问题。
        - 参与业务中的数据分析任务，评估用户请求的真实意图并进行分类。
        - 负责情报汇总和未知风险发现，结合蓝军攻防经验探索自动化评测，维护多种攻击手法和高质量数据集。
        - 资产测绘和评估，对抖音业务线中的AI资产进行测绘和安全水位评估，梳理Agent Harness架构，分析潜在安全风险。

